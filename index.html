    /* Top Clean Header */
    .top-navbar {
      background: #ffffff;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;

    .brand-logo-area { display: flex; align-items: center; gap: 12px; }

      border-radius: 8px;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .brand-title-wrap h2 { font-size: 17px; color: #0f172a; font-weight: 700; margin: 0; }

    /* Top User Bar (Dashboard) */

      color: #ffffff;

      justify-content: space-between;

      border-bottom: 2px solid #3b82f6;

      gap: 10px;
    }
    .wallet-pill { background: #059669; color: white; padding: 7px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }

    .btn-admin-ledger { background: #0891b2; display: none; }
    .btn-my-orders { background: #0284c7; }
    .btn-exit { background: #ef4444; border-radius: 6px; }

      color: #93c5fd;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
