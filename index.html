<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGHU BABA ONLINE SERVICE - B2B Digital Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #080e1e; color: #1e293b; min-height: 100vh; padding-bottom: 60px; }

    /* Top Header */
    .site-header {
      background: linear-gradient(135deg, #ff671f, #ffffff, #046a38);
      padding: 16px 20px;
      text-align: center;
      color: #061738;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      border-bottom: 3px solid #06038d;
    }
    .site-header h1 { font-size: 26px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }
    .site-header p { font-size: 13px; margin-top: 4px; font-weight: 700; color: #0f172a; }

    /* Top User Bar */
    #userBar {
      display: none;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-bottom: 3px solid #ff671f;
      flex-wrap: wrap;
      gap: 10px;
    }
    .wallet-pill { background: #046a38; color: white; padding: 7px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; border: 1px solid #10b981; }
    .btn-bar-action { border: none; padding: 7px 14px; border-radius: 20px; font-weight: 700; cursor: pointer; color: white; font-size: 12px; }
    .btn-admin-manage { background: #d97706; display: none; }
    .btn-admin-orders { background: #2563eb; display: none; }
    .btn-admin-recharge { background: #7c3aed; display: none; }
    .btn-admin-ledger { background: #0891b2; display: none; }
    .btn-my-orders { background: #0284c7; }
    .btn-exit { background: #dc2626; border-radius: 6px; padding: 7px 14px; border: none; color: white; font-weight: 700; cursor: pointer; }

    /* Container */
    .main-wrap { max-width: 1200px; margin: 25px auto; padding: 0 15px; }

    /* Tiranga Styled Bold Login & Registration Cards */
    .card-box {
      max-width: 440px;
      margin: 40px auto;
      background: #ffffff;
      padding: 32px 26px;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      border: 2px solid #cbd5e1;
      border-top: 8px solid #ff671f;
      border-bottom: 8px solid #046a38;
      text-align: center;
      display: block;
      position: relative;
    }
    .card-box h2 { 
      font-size: 24px; 
      font-weight: 800; 
      color: #06038d; 
      letter-spacing: 0.5px;
      margin-bottom: 6px; 
      text-transform: uppercase;
    }
    .card-box p.subtitle { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 22px; }

    .input-group { text-align: left; margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%; padding: 12px; border: 2px solid #94a3b8; border-radius: 6px; font-size: 14px; font-weight: 600; outline: none; background: #f8fafc;
    }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: #06038d; background: #ffffff; }

    .btn-submit {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #06038d, #1e3a8a);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(6, 3, 141, 0.3);
    }
    .btn-submit:hover { opacity: 0.95; }
    .btn-reg { background: linear-gradient(135deg, #046a38, #059669) !important; box-shadow: 0 4px 10px rgba(4, 106, 56, 0.3) !important; }

    .switch-tab { margin-top: 20px; font-size: 13px; font-weight: 600; color: #334155; }
    .switch-tab a { color: #06038d; font-weight: 800; text-decoration: underline; cursor: pointer; }

    /* Dashboard Layout */
    #dashboardView { display: none; }
    .panel-header { font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 18px; border-left: 5px solid #ff671f; padding-left: 12px; }

    /* Services Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .service-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      border-top: 4px solid #06038d;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .service-card h3 { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .tag-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
    .b-blue { background: #e0f2fe; color: #0369a1; }

    .card-btns { display: flex; gap: 8px; margin-top: 14px; }
    .c-btn { flex: 1; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; text-align: center; }
    .btn-open { background: #06038d; color: white; }

    /* Dynamic Module Box */
    .module-card {
      background: #ffffff; border-radius: 10px; padding: 22px;
      border-top: 5px solid #046a38; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    #adminNoticeAlert {
      display: none;
      background: #dc2626;
      color: white;
      padding: 14px 20px;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }
  </style>
</head>

  <div class="site-header">
    <h1>RAGHU BABA ONLINE SERVICE</h1>

      <button class="btn-bar-action btn-my-orders" id="btnMyOrders" onclick="openRetailerOrdersPanel()">📑 Mere Orders</button>
      <div class="wallet-pill" id="barWalletPill" onclick="openRechargeModule()">💰 Wallet: ₹<span id="barWalletAmt">0.00</span> ➕</div>
      <button class="btn-exit" onclick="doLogout()">Logout</button>

  </div>

  <div class="main-wrap">

    <div class="card-box" id="loginBox">

        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Apna password darj karein" autocomplete="current-password">
