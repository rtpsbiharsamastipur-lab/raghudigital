<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGHU BABA ONLINE SERVICE - B2B Digital Portal</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: #0b1329; color: #1e293b; min-height: 100vh; padding-bottom: 50px; }

    /* Top Colorful Header */
    .site-header {
      background: linear-gradient(135deg, #e11d48, #059669, #2563eb);
      padding: 18px 20px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .site-header h1 { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
    .site-header p { font-size: 13px; margin-top: 4px; font-weight: 500; opacity: 0.95; }

    /* Top User Bar (Dashboard) */
    #userBar {
      display: none;
      background: #1e293b;
      color: #ffffff;
      padding: 12px 20px;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-bottom: 2px solid #3b82f6;
    }
    .wallet-pill { background: #059669; color: white; padding: 7px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .wallet-pill:hover { background: #10b981; }
    .btn-admin-manage { background: #d97706; color: white; border: none; padding: 7px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; display: none; }
    .btn-admin-manage:hover { background: #f59e0b; }
    .btn-exit { background: #ef4444; color: white; border: none; padding: 7px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }

    /* Container */
    .main-wrap { max-width: 1100px; margin: 25px auto; padding: 0 15px; }

    /* Card Box (Login & Reg) */
    .card-box {
      max-width: 400px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border-top: 5px solid #2563eb;
      text-align: center;
    }
    .card-box h2 { font-family: 'Poppins', sans-serif; font-size: 22px; color: #0f172a; margin-bottom: 6px; }
    .card-box p.subtitle { font-size: 13px; color: #64748b; margin-bottom: 22px; }

    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%; padding: 11px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; background: #f8fafc;
    }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: #2563eb; background: #ffffff; }

    .btn-submit {
      width: 100%; background: #2563eb; color: white; border: none;
      padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-submit:hover { opacity: 0.95; }
    .btn-reg { background: #059669 !important; }

    .switch-tab { margin-top: 15px; font-size: 13px; }
    .switch-tab a { color: #2563eb; font-weight: 600; text-decoration: none; cursor: pointer; }

    /* Dashboard Layout */
    #dashboardView { display: none; }
    .panel-header { font-family: 'Poppins', sans-serif; font-size: 19px; font-weight: 600; color: #ffffff; margin-bottom: 18px; border-left: 4px solid #ef4444; padding-left: 12px; }
