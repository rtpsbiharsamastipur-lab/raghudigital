<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGHU BABA ONLINE SERVICE - B2B Digital Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f4f8; color: #1e293b; min-height: 100vh; }

    /* Colorful Header */
    header {
      background: linear-gradient(135deg, #ff4757, #2ed573, #1e90ff);
      padding: 18px 20px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 24px; font-weight: 800; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
    header p { font-size: 13px; font-weight: 600; margin-top: 4px; }

    /* Top User Bar */
    #topBar {
      display: none;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-bottom: 3px solid #ffa502;
    }
    .wallet-btn { background: #2ed573; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; border: none; }
    .btn-logout { background: #ff4757; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Main Container */
    .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }

    /* Auth Box */
    .auth-card {
      max-width: 420px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border-top: 5px solid #1e90ff;
    }
    .auth-card h2 { text-align: center; color: #1e293b; font-size: 20px; margin-bottom: 6px; }
    .auth-card p.desc { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 20px; }

    .field { margin-bottom: 15px; text-align: left; }
    .field label { display: block; font-size: 12px; font-weight: bold; color: #334155; margin-bottom: 5px; }
    .field input, .field textarea {
      width: 100%; padding: 11px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none;
    }
    .field input:focus { border-color: #1e90ff; }

    .btn-action {
      width: 100%; background: #1e90ff; color: white; padding: 12px;
      border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    .btn-action:hover { opacity: 0.95; }
