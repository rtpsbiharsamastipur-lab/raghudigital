<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGHU BABA ONLINE SERVICE - B2B Digital Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0b1329; color: #1e293b; min-height: 100vh; padding-bottom: 50px; }

    /* Top Colorful Header */
    .site-header {
      background: linear-gradient(135deg, #e11d48, #059669, #2563eb);
      padding: 18px 20px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .site-header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
    .site-header p { font-size: 13px; margin-top: 4px; font-weight: 500; }

    /* Top User Bar (Dashboard) */
    #userBar {
      display: none;
      background: #1e293b;
      color: #ffffff;
      padding: 12px 20px;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-bottom: 2px solid #3b82f6;
      flex-wrap: wrap;
      gap: 10px;
    }
    .wallet-pill { background: #059669; color: white; padding: 7px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    .btn-bar-action { border: none; padding: 7px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; color: white; }
    .btn-admin-manage { background: #d97706; display: none; }
    .btn-admin-orders { background: #2563eb; display: none; }
    .btn-my-orders { background: #0284c7; }
    .btn-exit { background: #ef4444; border-radius: 6px; }

    /* Container */
    .main-wrap { max-width: 1100px; margin: 25px auto; padding: 0 15px; }

    /* Card Box (Login & Reg) */
    .card-box {
      max-width: 400px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border-top: 5px solid #2563eb;
      text-align: center;
    }
    .card-box h2 { font-size: 22px; color: #0f172a; margin-bottom: 6px; }
    .card-box p.subtitle { font-size: 13px; color: #64748b; margin-bottom: 22px; }

    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%; padding: 11px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; background: #f8fafc;
    }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: #2563eb; background: #ffffff; }

    .btn-submit {
      width: 100%; background: #2563eb; color: white; border: none;
      padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-reg { background: #059669 !important; }

    .switch-tab { margin-top: 15px; font-size: 13px; }
    .switch-tab a { color: #2563eb; font-weight: 600; text-decoration: none; cursor: pointer; }

    /* Dashboard View */
    #dashboardView { display: none; }
    .panel-header { font-size: 19px; font-weight: 600; color: #ffffff; margin-bottom: 18px; border-left: 4px solid #ef4444; padding-left: 12px; }

    /* Services Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .service-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border-top: 4px solid #2563eb;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .service-card h3 { font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 6px; }
    .tag-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .b-blue { background: #e0f2fe; color: #0369a1; }
    .b-red { background: #ffe4e6; color: #be123c; }

    .card-btns { display: flex; gap: 8px; margin-top: 14px; }
    .c-btn { flex: 1; padding: 9px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; text-align: center; }
    .btn-open { background: #2563eb; color: white; }

    /* Dynamic Module Box */
    .module-card {
      display: none; background: #ffffff; border-radius: 10px; padding: 24px;
      border-top: 5px solid #059669; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    .qr-container { text-align: center; background: #f8fafc; padding: 15px; border: 1.5px dashed #cbd5e1; border-radius: 8px; margin: 15px 0; }

    /* Tables */
    .admin-table-wrap { overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    .admin-table th { background: #0f172a; color: #ffffff; padding: 12px 14px; font-weight: 600; }
    .admin-table td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; color: #334155; }
    .admin-table tr:hover { background: #f8fafc; }
    .btn-action-small { background: #059669; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px; }

    /* Status Badges */
    .st-pending { background: #fef3c7; color: #b45309; padding: 4px 8px; border-radius: 12px; font-weight: 600; font-size: 11px; }
    .st-processing { background: #e0f2fe; color: #0284c7; padding: 4px 8px; border-radius: 12px; font-weight: 600; font-size: 11px; }
    .st-completed { background: #dcfce7; color: #15803d; padding: 4px 8px; border-radius: 12px; font-weight: 600; font-size: 11px; }
    .st-refunded { background: #ffe4e6; color: #b91c1c; padding: 4px 8px; border-radius: 12px; font-weight: 700; font-size: 11px; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="site-header">
    <h1>RAGHU BABA ONLINE SERVICE</h1>
    <p>⚡ All B2B Digital &amp; Printing Services • Dedicated Retailer Portal ⚡</p>
  </div>

  <!-- Top Bar -->
  <div id="userBar">
    <div>Dukandar: <strong id="barUserName" style="color: #facc15; font-size: 14px;"></strong> (<span id="barUserPhone"></span>)</div>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <button class="btn-bar-action btn-admin-orders" id="btnAdminOrders" onclick="openAdminOrdersPanel()">📦 Orders Desk</button>
      <button class="btn-bar-action btn-admin-manage" id="btnAdminPanel" onclick="openAdminPanel()">👑 Retailer Control</button>
      <button class="btn-bar-action btn-my-orders" id="btnMyOrders" onclick="openRetailerOrdersPanel()">📑 Mere Orders</button>
      <div class="wallet-pill" onclick="openRechargeModule()">💰 Wallet: ₹<span id="barWalletAmt">0.00</span> ➕</div>
      <button class="btn-bar-action btn-exit" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="main-wrap">

    <!-- 1. LOGIN SCREEN -->
    <div class="card-box" id="loginBox">
      <h2>🔐 Retailer Login</h2>
      <p class="subtitle">Apna ID aur Password darj karein</p>

      <div class="input-group">
        <label>User ID / Mobile Number</label>
        <input type="text" id="loginId" placeholder="User ID ya Mobile number">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Password">
      </div>
